name: Build Windows EXE

on:
  workflow_dispatch: {}         # allows manual run from Actions UI
  push:
    tags:
      - 'v*'                    # optional: build on tags like v1.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # or 3.8+ as required

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        # Use the same add-data pattern so scripts/ is included in bundle
        run: |
          pyinstaller --clean --onefile --windowed --name WinRepairTool --add-data "scripts;scripts" src\gui.py
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinRepairTool
          path: dist/WinRepairTool.exe
